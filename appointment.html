<!-- APPOINTMENT -->

<div class="container py-5">

    <div class="appointment-card">

        <h1 class="text-primary text-center">
            Book Appointment
        </h1>


        <form class="needs-validation mt-4"
              novalidate>


            <!-- PATIENT NAME -->

            <div class="mb-3">

                <label class="form-label">
                    Patient Name
                </label>

                <input type="text"
                       class="form-control"
                       required>

                <div class="invalid-feedback">
                    Please enter patient name.
                </div>

            </div>


            <!-- AGE -->

            <div class="mb-3">

                <label class="form-label">
                    Age
                </label>

                <input type="number"
                       class="form-control"
                       min="1"
                       max="120"
                       required>

                <div class="invalid-feedback">
                    Please enter a valid age.
                </div>

            </div>


            <!-- DEPARTMENT -->

            <div class="mb-3">

                <label class="form-label">
                    Department
                </label>

                <select class="form-select"
                        required>

                    <option value="">
                        Select Department
                    </option>

                    <option>Cardiology</option>
                    <option>Neurology</option>
                    <option>Orthopedics</option>
                    <option>Pediatrics</option>
                    <option>Ophthalmology</option>
                    <option>General Medicine</option>

                </select>

                <div class="invalid-feedback">
                    Please select a department.
                </div>

            </div>


            <!-- DOCTOR -->

            <div class="mb-3">

                <label class="form-label">
                    Doctor
                </label>

                <select class="form-select"
                        required>

                    <option value="">
                        Select Doctor
                    </option>

                    <option>Dr. Priya Sharma</option>
                    <option>Dr. Rahul Patil</option>
                    <option>Dr. Amit Deshmukh</option>
                    <option>Dr. Sneha Kulkarni</option>
                    <option>Dr. Neha Joshi</option>
                    <option>Dr. Rohan Mehta</option>

                </select>

                <div class="invalid-feedback">
                    Please select a doctor.
                </div>

            </div>


            <!-- DATE -->

            <div class="mb-3">

                <label class="form-label">
                    Appointment Date
                </label>

                <input type="date"
                       class="form-control"
                       required>

                <div class="invalid-feedback">
                    Please select a date.
                </div>

            </div>


            <!-- SUBMIT -->

            <button type="submit"
                    class="btn btn-primary">

                <i class="bi bi-calendar-check"></i>

                Submit Appointment

            </button>


        </form>

    </div>

</div>
